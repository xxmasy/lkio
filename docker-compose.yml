services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: lkio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lkio
      POSTGRES_USER: lkio
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "54329:5432"
    volumes:
      - lkio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lkio -d lkio"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lkio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://lkio:change-me-local-only@postgres:5432/lkio
      APP_ENV: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: lkio-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lkio-mcp
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "core.mcp.server"]

volumes:
  lkio_pgdata:
